name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for z in *.zip; do unzip -q -o "$z"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd "$(dirname "$(find . -name settings.gradle.kts | head -n 1)")" && gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
